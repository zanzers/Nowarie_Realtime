services:
  db:
    image: postgres:17
    container_name: nowarie-realtime-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nowarie_realtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - nowarie_realtime_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nowarie_realtime"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nowarie_realtime_data: