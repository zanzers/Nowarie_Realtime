name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_ISSUER: nowarie-test
      JWT_AUDIENCE: nowarie-realtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-timeout

      - name: Create database tables
        run: |
          python -c "from app.db.database import Base, engine; import app.db.message_repository; Base.metadata.create_all(bind=engine)"

      - name: Generate test JWT keys
        run: |
          openssl genrsa -out app/lib/test_private.pem 2048
          openssl rsa -in app/lib/test_private.pem -pubout -out app/lib/test_public.pem

      - name: Run tests
        run: python -m pytest -v -x --timeout=30
