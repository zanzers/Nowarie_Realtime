name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-timeout
      
      - name: Generate test JWT keys
        run: |
          openssl genrsa -out app/lib/test_private.pem 2048
          openssl rsa -in app/lib/test_private.pem -pubout -out app/lib/test_public.pem

      - name: Run tests
        run: python -m pytest -v -x --timeout=30
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_ISSUER: nowarie-test
          JWT_AUDIENCE: nowarie-realtime